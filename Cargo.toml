[package]
name = "pupoxide"
version = "0.2.3"
edition = "2024"
description = "A high-performance, memory-safe, declarative configuration management tool inspired by Puppet."
authors = ["iTmage Lab <contact@itmagelab.ru>"]
license = "MIT"
readme = "README.md"
repository = "https://gitverse.ru/itmagelab/pupoxide"
homepage = "https://gitverse.ru/itmagelab/pupoxide"
keywords = ["scm", "puppet", "automation", "devops", "IaC"]
categories = ["config", "os"]

[dependencies]
tokio = { version = "1.41", features = ["full"] }
sea-orm = { version = "1.1", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10"
validator = { version = "0.20", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
rhai = { version = "1.19", features = ["sync", "serde"] }
axum = "0.8"
hyper = { version = "1.8", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13.1", features = ["json"] }
chrono = "0.4"
sysinfo = "0.37"
sha2 = "0.10"
nix = { version = "0.30.1", features = ["user", "fs"] }
rcgen = "0.12"
rustls-pemfile = "2.0"
tokio-rustls = "0.24"
rustls = { version = "0.21.12", features = ["dangerous_configuration"] }
time = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
colored = "2.1"
tera = "1.20"
petgraph = { version = "0.8.3", features = ["serde", "serde-1"] }

[dev-dependencies]
tempfile = "3"
